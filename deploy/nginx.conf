# Reverse proxy for the Gridfinity Cutout Generator.
# Placeholders are filled in by deploy/install.sh.

server {
    listen __HTTP_PORT__;
    listen [::]:__HTTP_PORT__;
    server_name __SERVER_NAME__;

    # Photos from a modern phone are large, and a scan uploads many of them.
    client_max_body_size 64m;

    # Reconstruction is started asynchronously, but a slow upload over wifi
    # still needs room to finish.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml
               model/gltf-binary application/octet-stream;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
